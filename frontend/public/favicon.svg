<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00aa33" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="#020803" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-opacity="0.5" />

  <g filter="url(#neonBlur)">
    <!-- Hood silhouette -->
    <path d="M32 7 C21 7 13 16 13 30 C13 42 18 51 24 55 L25 57 L39 57 L40 55 C46 51 51 42 51 30 C51 16 43 7 32 7 Z" fill="#041407" stroke="#00ff66" stroke-width="2.2" stroke-linejoin="round" />
    
    <!-- Face cavity -->
    <path d="M32 13 C24 13 18 20 18 31 C18 41 23 48 32 50 C41 48 46 41 46 31 C46 20 40 13 32 13 Z" fill="#010502" />

    <!-- Hacker Mask / Glasses -->
    <polygon points="21,27 30,28 28,33 21,31" fill="#00ff66" />
    <polygon points="43,27 34,28 36,33 43,31" fill="#00ff66" />
    
    <!-- Nose bridge / mask connection -->
    <line x1="30" y1="28" x2="34" y2="28" stroke="#00ff66" stroke-width="1.8" />

    <!-- Terminal smile / code slash -->
    <path d="M26 40 L32 43 L38 40" fill="none" stroke="#00ff66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Terminal prompt mark on chest -->
    <path d="M28 53 L31 55 L28 57" fill="none" stroke="#00ff66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="33" y1="57" x2="36" y2="57" stroke="#00ff66" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>